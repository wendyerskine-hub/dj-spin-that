<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex"><title>GIF label check · DJ Spin That</title>
<style>
:root{--bg:#110a1d;--ink:#f4efff;--muted:#b8a9d6;--gold:#c77dff;--line:rgba(244,239,255,.16)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,sans-serif;padding:20px max(16px,env(safe-area-inset-right)) 60px max(16px,env(safe-area-inset-left))}
h1{font-size:24px;margin:0 0 6px}p{color:var(--muted);margin:0 0 18px;max-width:60ch}
.g{display:grid;gap:16px;max-width:560px}
.c{border:1px solid var(--line);border-radius:14px;padding:12px;display:grid;gap:8px}
.c img{width:100%;border-radius:10px;background:#000;aspect-ratio:480/306;object-fit:cover}
.c code{color:var(--gold);font-size:13px}
select{font:inherit;font-size:16px;padding:10px;border-radius:10px;background:#1f1433;color:var(--ink);border:1px solid var(--gold)}
button{font:inherit;font-weight:700;font-size:17px;padding:14px 22px;border:0;border-radius:999px;background:var(--gold);color:#1a0b2e;cursor:pointer;margin-top:8px}
textarea{width:100%;min-height:130px;margin-top:10px;background:#1f1433;color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:10px;font:13px ui-monospace,monospace}
</style></head><body>
<h1>GIF label check</h1>
<p>For each GIF, pick what it really shows. Then tap <b>Copy my answers</b> and paste them into the chat.</p>
<div class="g" id="g"></div>
<button type="button" id="copy">Copy my answers</button>
<textarea id="out" readonly placeholder="Your answers will appear here too."></textarea>
<script>
const IDS=["DYVffwyCYT22rgYSPn","AZPiPZThCcf6lwvQIR","YWrjhEypPnWCyxOcqG","OUSPq0WJk7c7w4oFzy","teUCLxqhJ5hXA2frfU"];
const OPTS=["#1 The original · Bon Voyage","#2 RM · Run BTS ep. 74","#3 Jung Kook · Run BTS ep. 67","#4 Jin & j-hope · Run BTS ep. 136","#5 SUGA, V & j-hope · V LIVE / Weverse","#6 Jung Kook · Run BTS ep. 153","Something else (I'll describe it)"];
const g=document.getElementById('g');
g.innerHTML=IDS.map((id,i)=>`<div class="c"><img src="https://media.giphy.com/media/${id}/giphy.gif" alt="GIF ${i+1}"><code>${id.slice(0,6)}</code><select data-id="${id}"><option value="">What is this GIF?</option>${OPTS.map(o=>`<option>${o}</option>`).join('')}</select></div>`).join('');
function answers(){return [...document.querySelectorAll('select')].map(s=>`${s.dataset.id.slice(0,6)} = ${s.value||'?'}`).join('\n')}
document.getElementById('copy').onclick=()=>{const t=answers();const o=document.getElementById('out');o.value=t;navigator.clipboard.writeText(t).then(()=>{document.getElementById('copy').textContent='Copied! Paste it in the chat'}).catch(()=>{o.select()})};
</script></body></html>
