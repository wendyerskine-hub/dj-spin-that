<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Little ARMY Card Studio · DJ Spin That</title>
<meta property="og:title" content="You got a card from a little ARMY! 💜">
<meta property="og:description" content="Open it to see your DJ Spin That card and save it.">
<meta property="og:image" content="https://djspinthat.net/og-card.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;900&family=Outfit:wght@400;600;800&family=JetBrains+Mono:wght@600&family=Noto+Sans+KR:wght@700&display=swap">
<script src="qrcode.js"></script>
<style>
/* Kid-friendly card maker for an iPad: huge buttons, three steps, card flips, friend scans a QR to keep it. */
:root{--bg:#120a20;--ink:#fff;--muted:#d6c8f5;--violet:#a855f7;--red:#ff2a4b;--line:rgba(255,255,255,.18);color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(70% 50% at 0% 0%,rgba(255,42,75,.30),transparent 70%),radial-gradient(70% 50% at 100% 100%,rgba(168,85,247,.35),transparent 70%),var(--bg);color:var(--ink);font-family:Outfit,system-ui,sans-serif}
main{max-width:980px;margin:0 auto;padding-block:24px 60px;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));display:grid;gap:22px}
h1{margin:0;font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:clamp(40px,7vw,64px);line-height:.95;text-transform:uppercase}
h1 .r{color:var(--red)}h1 .p{color:var(--violet)}
.sub{margin:6px 0 0;font-size:20px;color:var(--muted)}
.step{display:grid;gap:12px}
.step h2{margin:0;font-size:26px;display:flex;align-items:center;gap:12px}
.step h2 .n{display:inline-grid;place-items:center;width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,var(--red),var(--violet));font-size:22px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(140px,1fr))}
.pick{appearance:none;border:3px solid var(--line);border-radius:22px;background:rgba(255,255,255,.06);color:var(--ink);padding:14px 10px;min-height:110px;display:grid;place-items:center;gap:4px;cursor:pointer;font:800 26px Outfit,sans-serif;touch-action:manipulation}
.pick small{font:700 18px 'Noto Sans KR',sans-serif;color:var(--muted)}
.pick .dot{width:26px;height:26px;border-radius:50%;box-shadow:0 0 0 3px rgba(255,255,255,.4)}
.pick[aria-pressed="true"]{border-color:var(--c,#fff);background:rgba(255,255,255,.16);box-shadow:0 0 24px var(--c,#a855f7)}
.stk{grid-template-columns:repeat(auto-fill,minmax(84px,1fr))}.stk .pick{min-height:84px;font-size:44px}
input[type=text]{width:100%;min-height:68px;padding:12px 18px;border-radius:20px;border:3px solid var(--line);background:rgba(0,0,0,.35);color:var(--ink);font:800 30px Outfit,sans-serif}
input:focus-visible,.pick:focus-visible,.big:focus-visible{outline:4px solid #ffd166;outline-offset:3px}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.big{appearance:none;border:0;border-radius:999px;min-height:76px;padding:14px 34px;font:900 30px 'Barlow Condensed',sans-serif;letter-spacing:.03em;text-transform:uppercase;color:#fff;background:linear-gradient(90deg,var(--red),var(--violet));cursor:pointer;box-shadow:0 8px 30px rgba(168,85,247,.45);touch-action:manipulation}
.big.alt{background:rgba(255,255,255,.1);border:3px solid var(--line);box-shadow:none}
.lbl{font-size:18px;color:var(--muted)}
/* result */
#result{display:grid;gap:18px;justify-items:center;text-align:center}
.stage{perspective:1600px}
.flip{position:relative;width:min(78vw,340px);aspect-ratio:650/1004;transform-style:preserve-3d;transition:transform 1.1s cubic-bezier(.3,.7,.2,1);cursor:pointer}
.flip canvas{position:absolute;inset:0;width:100%;height:100%;border-radius:20px;backface-visibility:hidden;-webkit-backface-visibility:hidden;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.flip canvas.b{transform:rotateY(180deg)}
.flip.turned{transform:rotateY(180deg)}
.qrbox{display:grid;gap:10px;justify-items:center;background:#fff;color:#1a0b2e;border-radius:24px;padding:18px 18px 14px}
.qrbox b{font-size:22px}
#qr svg{width:240px;height:240px;display:block}
.hint{font-size:17px;color:var(--muted);margin:0}
.done{font-size:30px;font-weight:800;margin:0}
@media (prefers-reduced-motion:reduce){.flip{transition:none}}
</style>
</head>
<body>
<main id="maker">
  <header>
    <h1><span class="r">Little ARMY</span> <span class="p">Card Studio</span></h1>
    <p class="sub">Make a DJ Spin That card for a new ARMY friend 💜</p>
  </header>

  <section class="step" aria-labelledby="s1"><h2 id="s1"><span class="n">1</span>Who is their bias?</h2><div class="grid" id="members" role="group" aria-labelledby="s1"></div></section>
  <section class="step" aria-labelledby="s2"><h2 id="s2"><span class="n">2</span>Pick a sticker</h2><div class="grid stk" id="stickers" role="group" aria-labelledby="s2"></div></section>
  <section class="step" aria-labelledby="s3"><h2 id="s3"><span class="n">3</span>Their name</h2>
    <input type="text" id="to" maxlength="14" autocomplete="off" autocapitalize="words" placeholder="Friend's first name">
    <label class="lbl" for="from">From (your ARMY name):</label>
    <input type="text" id="from" maxlength="14" autocomplete="off" autocapitalize="words" placeholder="Your nickname">
  </section>
  <div class="row"><button class="big" id="make" type="button">✨ Make the card!</button></div>
</main>

<main id="resultWrap" hidden>
  <section id="result" aria-live="polite">
    <p class="done" id="doneTxt">Here's your card! 💜</p>
    <div class="stage"><div class="flip" id="flip" role="button" tabindex="0" aria-label="Tap to flip the card"><canvas class="f" id="cvF" width="650" height="1004"></canvas><canvas class="b" id="cvB" width="650" height="1004"></canvas></div></div>
    <p class="hint">Tap the card to flip it</p>
    <div class="qrbox" id="qrbox"><b>Scan to keep your card! 📱</b><div id="qr"></div><span style="font-size:14px">Open your phone camera and point it here</span></div>
    <div class="row" style="justify-content:center">
      <button class="big" id="save" type="button">💾 Save / AirDrop</button>
      <button class="big alt" id="again" type="button">➕ Make another</button>
    </div>
    <p class="hint" id="recvHint" hidden>Want every BTS surprise song? Visit <a href="/" style="color:#d6c8f5">djspinthat.net</a> 🎧</p>
  </section>
</main>

<script>
(function(){
const $=s=>document.querySelector(s);
const M={
 rm:{n:'RM',kr:'알엠',c:'#c9ced8',l:['#f2f4f8','#9aa1ad'],ink:'#1b1f2a',e:'🐨'},
 jin:{n:'Jin',kr:'진',c:'#ff8fc8',l:['#ffc2e1','#ff6fb5'],ink:'#4a0d2c',e:'🐹'},
 suga:{n:'SUGA',kr:'슈가',c:'#c9ced8',l:['#f2f4f8','#9aa1ad'],ink:'#1b1f2a',e:'🐱'},
 jhope:{n:'j-hope',kr:'제이홉',c:'#f4f4f8',l:['#ffffff','#d9dbe3'],ink:'#2a1f3a',e:'🐿️',lower:1},
 jimin:{n:'Jimin',kr:'지민',c:'#c9ced8',l:['#3a3a46','#15151b'],ink:'#e6e8ee',e:'🐥'},
 v:{n:'V',kr:'뷔',c:'#ff4d5e',l:['#ff8a95','#e0263a'],ink:'#3b0710',e:'🐯'},
 jk:{n:'Jung Kook',kr:'정국',c:'#e8c46a',l:['#fff0bf','#d4a53a'],ink:'#3a2a05',e:'🐰'},
 ot7:{n:'OT7',kr:'방탄소년단',c:'#b48cff',l:null,ink:'#fff',e:'💜'}
};
const ORDER=['rm','jin','suga','jhope','jimin','v','jk','ot7'];
const STICKERS=['💜','⭐','🎧','🌊','🐨','🐹','🐱','🐿️','🐥','🐯','🐰','🌸','🦋','🌙'];
const clean=s=>String(s||'').replace(/[<>]/g,'').replace(/\s+/g,' ').trim().slice(0,14);
let pick='jk',sticker='💜';
try{const f=localStorage.getItem('la-from');if(f)$('#from').value=f}catch(e){}

$('#members').innerHTML=ORDER.map(k=>{const d=M[k];return `<button type="button" class="pick" data-m="${k}" aria-pressed="${k===pick}" style="--c:${d.c}"><span class="dot" style="background:${k==='ot7'?'conic-gradient(#c9ced8,#ff8fc8,#c9ced8,#f4f4f8,#2a2a33,#ff4d5e,#e8c46a,#c9ced8)':k==='jimin'?'#15151b':d.c}"></span>${d.n}<small>${d.kr}</small></button>`}).join('');
$('#stickers').innerHTML=STICKERS.map(s=>`<button type="button" class="pick" data-s="${s}" aria-pressed="${s===sticker}" aria-label="Sticker ${s}">${s}</button>`).join('');
document.addEventListener('click',e=>{const b=e.target.closest('[data-m],[data-s]');if(!b)return;
  if(b.dataset.m){pick=b.dataset.m;document.querySelectorAll('[data-m]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));if(sticker==='💜'||Object.values(M).some(d=>d.e===sticker)){sticker=M[pick].e;document.querySelectorAll('[data-s]').forEach(x=>x.setAttribute('aria-pressed',String(x.dataset.s===sticker)))}}
  else{sticker=b.dataset.s;document.querySelectorAll('[data-s]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)))}});

/* ---- drawing ---- */
const W=650,H=1004;
function rr(x,X,Y,w,h,r){x.beginPath();x.moveTo(X+r,Y);x.arcTo(X+w,Y,X+w,Y+h,r);x.arcTo(X+w,Y+h,X,Y+h,r);x.arcTo(X,Y+h,X,Y,r);x.arcTo(X,Y,X+w,Y,r);x.closePath()}
function ground(x){x.fillStyle='#0b0912';x.fillRect(0,0,W,H);let g=x.createRadialGradient(80,60,0,80,60,700);g.addColorStop(0,'rgba(255,42,75,.42)');g.addColorStop(1,'rgba(255,42,75,0)');x.fillStyle=g;x.fillRect(0,0,W,H);g=x.createRadialGradient(W-60,H-60,0,W-60,H-60,760);g.addColorStop(0,'rgba(168,85,247,.5)');g.addColorStop(1,'rgba(168,85,247,0)');x.fillStyle=g;x.fillRect(0,0,W,H)}
function frame(x,c){x.save();x.shadowColor=c;x.shadowBlur=26;x.lineWidth=5;x.strokeStyle=c;rr(x,22,22,W-44,H-44,32);x.stroke();x.restore()}
function fit(x,txt,font,max,size){let s=size;do{x.font=font.replace('{s}',s);s-=2}while(x.measureText(txt).width>max&&s>20);return s+2}
function drawFront(x,m,stk,to){const d=M[m];ground(x);frame(x,d.c);
  x.textAlign='center';x.fillStyle='#e6dbff';x.font="600 20px 'JetBrains Mono',monospace";x.fillText('ARIRANG',120,72);x.fillText('2026',W-110,72);
  x.font="900 40px 'Barlow Condensed',sans-serif";const a='DJ SPIN ',b='THAT',wa=x.measureText(a).width,wb=x.measureText(b).width,sx=W/2-(wa+wb)/2;x.textAlign='left';x.fillStyle='#ff2a4b';x.fillText(a,sx,128);x.fillStyle='#a855f7';x.fillText(b,sx+wa,128);x.textAlign='center';
  // record
  const cx=W/2,cy=370,R=190;x.save();x.shadowColor=d.c;x.shadowBlur=50;x.beginPath();x.arc(cx,cy,R,0,7);x.fillStyle='#08070c';x.fill();x.restore();
  for(let r=R-6;r>R*.36;r-=7){x.beginPath();x.arc(cx,cy,r,0,7);x.strokeStyle=r%14<7?'#1b1626':'#110e18';x.lineWidth=3;x.stroke()}
  const lr=R*.36;if(m==='ot7'){const cols=['#c9ced8','#ff8fc8','#c9ced8','#f4f4f8','#2a2a33','#ff4d5e','#e8c46a'];cols.forEach((c,i)=>{x.beginPath();x.moveTo(cx,cy);x.arc(cx,cy,lr,-Math.PI/2+i*2*Math.PI/7,-Math.PI/2+(i+1)*2*Math.PI/7);x.fillStyle=c;x.fill()})}
  else{const g=x.createLinearGradient(cx-lr,cy-lr,cx+lr,cy+lr);g.addColorStop(0,d.l[0]);g.addColorStop(1,d.l[1]);x.beginPath();x.arc(cx,cy,lr,0,7);x.fillStyle=g;x.fill();x.fillStyle=d.ink;x.font="900 30px 'Barlow Condensed',sans-serif";x.fillText('BTS',cx,cy-22)}
  x.beginPath();x.arc(cx,cy,8,0,7);x.fillStyle='#08070c';x.fill();
  // sticker
  x.font='96px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';x.fillText(stk,W-128,560);
  // name
  const nm=d.lower?d.n:d.n.toUpperCase();const s=fit(x,nm,"900 {s}px 'Barlow Condensed',sans-serif",W-120,120);x.font=`900 ${s}px 'Barlow Condensed',sans-serif`;x.save();x.shadowColor=d.c;x.shadowBlur=24;x.fillStyle=d.c;x.fillText(nm,W/2,690);x.restore();
  x.fillStyle='#fff';x.font="700 40px 'Noto Sans KR',sans-serif";x.fillText(d.kr,W/2,752);
  if(to){x.font="800 44px Outfit,sans-serif";const t='For '+to+' 💜';const ts=fit(x,t,"800 {s}px Outfit,sans-serif",W-120,44);x.font=`800 ${ts}px Outfit,sans-serif`;x.fillText(t,W/2,840)}
  x.fillStyle='#e6dbff';x.font="600 19px 'JetBrains Mono',monospace";x.fillText('A LITTLE ARMY FREEBIE 💜',W/2,H-62)}
function drawBack(x,from){ground(x);frame(x,'#a855f7');x.textAlign='center';
  const UM=[[0,1.0,17],[1.6,.6,15],[2.9,.9,17],[4.2,1.4,11],[4.5,2.9,14],[6.4,3.0,15],[6.6,1.2,18]],ux=v=>130+v*58,uy=v=>110+v*58;
  x.strokeStyle='rgba(230,219,255,.55)';x.lineWidth=3;x.beginPath();[0,1,2,3,4,5,6,3].forEach((i,k)=>{const X=ux(UM[i][0]),Y=uy(UM[i][1]);k?x.lineTo(X,Y):x.moveTo(X,Y)});x.stroke();
  UM.forEach(([a,b,r])=>{const X=ux(a),Y=uy(b),R=r*1.5;x.save();x.shadowColor='#b48cff';x.shadowBlur=14;x.beginPath();for(let k=0;k<10;k++){const an=-Math.PI/2+k*Math.PI/5,rr2=k%2?R*.45:R;x.lineTo(X+Math.cos(an)*rr2,Y+Math.sin(an)*rr2)}x.closePath();x.fillStyle='#fff';x.fill();x.restore()});
  x.save();x.shadowColor='#a855f7';x.shadowBlur=30;x.fillStyle='#fff';x.font="900 130px 'Barlow Condensed',sans-serif";x.fillText('ARMY',W/2,440);x.restore();
  x.fillStyle='#e6dbff';x.font="800 42px Outfit,sans-serif";x.fillText('Borahae 💜',W/2,505);
  x.fillStyle='#fff';x.font="800 34px Outfit,sans-serif";x.fillText('We met at the',W/2,610);x.fillText('BTS live viewing! 🎬',W/2,656);
  if(from){x.fillStyle='#e6dbff';x.font="800 36px Outfit,sans-serif";const t='From '+from;const s=fit(x,t,"800 {s}px Outfit,sans-serif",W-120,36);x.font=`800 ${s}px Outfit,sans-serif`;x.fillText(t,W/2,750)}
  x.fillStyle='#fff';x.font="800 26px Outfit,sans-serif";x.fillText('Every BTS surprise song 🎧',W/2,850);
  x.fillStyle='#e6dbff';x.font="600 26px 'JetBrains Mono',monospace";x.fillText('djspinthat.net',W/2,892)}

async function render(m,stk,to,from){try{await document.fonts.load("900 40px 'Barlow Condensed'");await document.fonts.load("800 40px Outfit");await document.fonts.load("700 40px 'Noto Sans KR'")}catch(e){}
  drawFront($('#cvF').getContext('2d'),m,stk,to);drawBack($('#cvB').getContext('2d'),from)}
function link(m,stk,to,from){const u=new URL(location.origin+location.pathname);u.searchParams.set('m',m);u.searchParams.set('s',stk);if(to)u.searchParams.set('to',to);if(from)u.searchParams.set('from',from);return u.toString()}
function cardBlob(){return new Promise(res=>{const c=document.createElement('canvas');c.width=W*2+40;c.height=H;const x=c.getContext('2d');x.fillStyle='#0b0912';x.fillRect(0,0,c.width,c.height);x.drawImage($('#cvF'),0,0);x.drawImage($('#cvB'),W+40,0);c.toBlob(res,'image/png')})}
let current=null;
async function show(m,stk,to,from,received){current={m,stk,to,from};$('#maker').hidden=true;$('#resultWrap').hidden=false;$('#flip').classList.remove('turned');
  await render(m,stk,to,from);
  $('#doneTxt').textContent=received?(to?`${to}, you got a card! 💜`:'You got a card! 💜'):'Here’s your card! 💜';
  $('#qrbox').hidden=!!received;$('#again').hidden=!!received;$('#recvHint').hidden=!received;
  if(!received){$('#qr').innerHTML='';if(window.qrcode){const q=qrcode(0,'M');q.addData(link(m,stk,to,from),'Byte');q.make();$('#qr').innerHTML=q.createSvgTag({cellSize:6,margin:0,scalable:true});const sv=$('#qr svg');if(sv){sv.setAttribute('width','240');sv.setAttribute('height','240');sv.querySelectorAll('path,rect').forEach(e=>{if(e.getAttribute('fill')==='black')e.setAttribute('fill','#1a0b2e')})}}else $('#qr').textContent=link(m,stk,to,from)}
  setTimeout(()=>$('#flip').classList.add('turned'),1400);setTimeout(()=>$('#flip').classList.remove('turned'),3400);
  scrollTo({top:0,behavior:'smooth'})}
$('#make').addEventListener('click',()=>{const to=clean($('#to').value),from=clean($('#from').value);try{localStorage.setItem('la-from',from)}catch(e){}show(pick,sticker,to,from,false)});
$('#flip').addEventListener('click',()=>$('#flip').classList.toggle('turned'));
$('#flip').addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();$('#flip').classList.toggle('turned')}});
$('#again').addEventListener('click',()=>{$('#resultWrap').hidden=true;$('#maker').hidden=false;$('#to').value='';$('#to').focus()});
$('#save').addEventListener('click',async()=>{const blob=await cardBlob();const file=new File([blob],'my-army-card.png',{type:'image/png'});
  if(navigator.canShare&&navigator.canShare({files:[file]})){try{await navigator.share({files:[file],title:'My ARMY card 💜'});return}catch(e){if(e&&e.name==='AbortError')return}}
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='my-army-card.png';document.body.appendChild(a);a.click();a.remove()});
// opened from a QR: show the friend's card
const P=new URLSearchParams(location.search);if(P.get('m')&&M[P.get('m')]){const stk=STICKERS.includes(P.get('s'))?P.get('s'):M[P.get('m')].e;show(P.get('m'),stk,clean(P.get('to')),clean(P.get('from')),true)}
})();
</script>
</body>
</html>
