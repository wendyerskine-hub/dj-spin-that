<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;900&family=Outfit:wght@400;600;800&family=JetBrains+Mono:wght@600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
html,body{width:1200px;height:630px;overflow:hidden;background:#0c0a12;color:#fff;font-family:Outfit,system-ui,sans-serif}
.card{position:relative;width:1200px;height:630px;padding:56px 64px;display:flex;flex-direction:column;justify-content:space-between;
 background:radial-gradient(70% 90% at 0% 0%,rgba(255,42,75,.42),transparent 60%),radial-gradient(70% 90% at 100% 100%,rgba(168,85,247,.5),transparent 60%),#0c0a12}
.kick{font-family:'JetBrains Mono',monospace;font-size:24px;letter-spacing:.18em;text-transform:uppercase;color:#d9c6ff}
.city{font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:96px;line-height:.9;text-transform:uppercase;margin-top:14px}
.city small{display:block;font-size:44px;color:#c9a8ff;margin-top:8px;font-weight:700}
.songs{font-weight:800;font-size:58px;line-height:1.05;max-width:820px;text-wrap:balance}
.songs .x{color:#ff2a4b;padding:0 .12em}
.songs.long{font-size:46px}.songs.xl{font-size:38px}
.foot{display:flex;align-items:center;gap:18px}
.url{font-family:'JetBrains Mono',monospace;font-size:28px;letter-spacing:.06em;padding:12px 22px;border:3px solid #a855f7;border-radius:999px;background:rgba(0,0,0,.45)}
.note{font-size:24px;color:#d9c6ff}
.logo{position:absolute;right:64px;top:56px;font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:56px;line-height:.85;text-transform:uppercase;text-align:right}
.logo .r{color:#ff2a4b}.logo .p{color:#a855f7}
.vinyl{position:absolute;right:-90px;bottom:-110px;width:440px;height:440px;border-radius:50%;background:repeating-radial-gradient(circle,#07060b 0 4px,#16121f 5px 7px);box-shadow:0 0 0 3px #2d374d,0 0 80px rgba(168,85,247,.35)}
.vinyl b{position:absolute;inset:36%;border-radius:50%;background:conic-gradient(#ff2a4b 0 50%,#a855f7 50% 100%)}
.vinyl b::after{content:"";position:absolute;left:50%;top:50%;width:14px;height:14px;margin:-7px;border-radius:50%;background:#07060b}
</style></head><body><div class="card">
<div class="vinyl"><b></b></div>
<div class="logo"><span class="r">DJ Spin</span><br><span class="p">That</span></div>
<div><div class="kick" id="kick"></div><div class="city" id="city"></div></div>
<div class="songs" id="songs"></div>
<div class="foot"><span class="url">djspinthat.net</span><span class="note" id="note"></span></div>
</div>
<script>
window.fill=function(d){
 document.getElementById('kick').textContent=d.kick;
 document.getElementById('city').innerHTML=d.city.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))+'<small>'+d.night.replace(/[&<>]/g,'')+'</small>';
 const s=document.getElementById('songs');s.innerHTML=d.songs.map(t=>t.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))).join('<span class="x">×</span>');
 const L=d.songs.join(' × ').length;s.className='songs'+(L>60?' xl':L>34?' long':'');
 document.getElementById('note').textContent=d.note||'';
};
</script></body></html>
