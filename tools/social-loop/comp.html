<script>
(function(){const P=new URLSearchParams(location.search);const W=+(P.get('w')||540),H=+(P.get('h')||960);
document.documentElement.style.cssText=document.body.style.cssText=`width:${W}px;height:${H}px`;
const st=document.querySelector('.stage');st.style.width=W+'px';st.style.height=H+'px';
const wrap=document.querySelector('.wrap');
if(H<=W){wrap.style.padding='34px 26px 34px';wrap.style.gap='14px';document.querySelector('.word').style.fontSize='60px';document.querySelector('svg.ctrl').style.width='470px';document.querySelector('svg.ctrl').style.margin='0';document.querySelector('.q').style.fontSize='28px'}
if(P.get('bg')){['kick','q'].forEach(i=>{const e=document.getElementById(i);if(e)e.remove()});document.querySelector('.word').remove();document.querySelector('.url').remove();document.querySelector('.fan').remove();wrap.style.padding='0';const c=document.querySelector('svg.ctrl');c.style.margin='0';c.style.width=(W>H?Math.round(W*0.86):Math.round(W*1.0))+'px';}
if(P.get('city')){
  document.getElementById('kick').textContent='ARIRANG Tour · '+P.get('city')+' · '+P.get('night');
  const [a,b]=P.get('songs').split('|');
  const q=document.getElementById('q');q.outerHTML=`<div class="lab">Tonight's surprise songs</div><div class="songs"><span class="a">${a}</span><span class="x">×</span><span class="b">${b}</span></div>`;
  if(H<=W)document.querySelector('.songs').style.fontSize='38px';
}})();
// Deterministic frame renderer: setFrame(t) with t in [0,1) loops seamlessly.
const $=id=>document.getElementById(id);
window.setFrame=function(t){
  const TAU=Math.PI*2, rot=t*360*3; // 3 full turns per loop
  $('leftPlatter').setAttribute('transform',`rotate(${rot} 255 310)`);
  $('rightPlatter').setAttribute('transform',`rotate(${rot} 945 310)`);
  const beat=(k)=>0.5+0.5*Math.cos(TAU*(t*12+k)); // 12 beats per loop
  $('barL').setAttribute('width',150+140*beat(0)*0.5+70*Math.abs(Math.sin(TAU*t*6)));
  const wR=150+70*beat(.5)+0*1; $('barR').setAttribute('width',wR);$('barR').setAttribute('x',1100-wR);
  const vl=40+52*beat(0),vr=45+52*beat(.25);
  $('vuL').setAttribute('height',vl);$('vuL').setAttribute('y',112-vl);
  $('vuR').setAttribute('height',vr);$('vuR').setAttribute('y',112-vr);
  $('wave').setAttribute('transform',`translate(${(t*80*6)%80} 0)`);
  $('xfader').setAttribute('transform',`translate(${40*Math.sin(TAU*t)} 0)`);
  const pads=['padL1','padL2','padL3','padR1','padR2','padR3'];const step=Math.floor(t*24)%6;
  pads.forEach((p,i)=>$(p).setAttribute('fill',i===step?(i<3?'#FF2A4B':'#A855F7'):(i<3?'#2A141A':'#1C142A')));
};
setFrame(0);
</script></body></html>
