<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=540,initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@800;900&family=JetBrains+Mono:wght@500;600&family=Outfit:wght@500;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}html,body{margin:0;width:540px;height:960px;overflow:hidden;background:#08090D;color:#fff;font-family:Outfit,sans-serif}
.bg{position:absolute;inset:0;background:radial-gradient(90% 50% at 0% 20%,rgba(255,42,75,.28),transparent 60%),radial-gradient(90% 50% at 100% 80%,rgba(168,85,247,.32),transparent 60%),#08090D}
.cap{position:absolute;left:0;right:0;top:70px;height:170px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 34px;transition:opacity .35s,transform .35s}
.cap.off{opacity:0;transform:translateY(8px)}
.step{font-family:'JetBrains Mono',monospace;font-size:13px;letter-spacing:.24em;text-transform:uppercase;color:#E0B8FF;margin-bottom:10px}
.t{font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:44px;line-height:.98;text-transform:uppercase;letter-spacing:.02em;text-wrap:balance}
.t em{font-style:normal;background:linear-gradient(90deg,#FF2A4B,#A855F7);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{margin-top:10px;font-size:17px;color:#CFC4E6}
.phone{position:absolute;left:50%;top:262px;width:318px;height:660px;transform:translateX(-50%);border-radius:40px;padding:9px;background:#14101f;box-shadow:0 0 0 2px #2D2440,-18px 0 50px -16px rgba(255,42,75,.45),18px 0 50px -16px rgba(168,85,247,.5)}
.screen{width:300px;height:642px;border-radius:32px;overflow:hidden;position:relative;background:#110a1d}
iframe{border:0;width:390px;height:834px;transform:scale(.7692);transform-origin:0 0;position:absolute;left:0;top:0}
.end{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;opacity:0;transition:opacity .5s;background:rgba(8,9,13,.92);text-align:center}
.end.on{opacity:1}
.end .w{font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:76px;line-height:.9;text-transform:uppercase}
.end .w .r{color:#FF2A4B;text-shadow:0 0 24px rgba(255,42,75,.5)}.end .w .p{color:#A855F7;text-shadow:0 0 24px rgba(168,85,247,.5)}
.end .u{font-family:'JetBrains Mono',monospace;font-size:20px;letter-spacing:.18em;padding:11px 22px;border:1.5px solid #2D374D;border-radius:999px;background:rgba(0,0,0,.45)}
.end .q{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:32px;text-transform:uppercase;line-height:1.05}
.end .f{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.14em;color:#8A93A6;text-transform:uppercase}
</style></head><body><div class="bg"></div>
<div class="cap" id="cap"><div class="step" id="step"></div><div class="t" id="t"></div><div class="sub" id="sub"></div></div>
<div class="phone"><div class="screen"><iframe id="site" src="about:blank"></iframe></div></div>
<div class="end" id="end"><div class="q">Which surprise song<br>did your city get?</div><div class="w"><span class="r">DJ Spin</span><br><span class="p">That</span></div><div class="u">DJSPINTHAT.NET</div><div class="f">Fan-made · Not affiliated with BTS, HYBE or BIGHIT MUSIC</div></div>
<script>
window.caption=(step,t,sub)=>{const c=document.getElementById('cap');c.classList.add('off');setTimeout(()=>{document.getElementById('step').textContent=step;document.getElementById('t').innerHTML=t;document.getElementById('sub').textContent=sub||'';c.classList.remove('off')},350)};
window.endCard=()=>document.getElementById('end').classList.add('on');
</script></body></html>
