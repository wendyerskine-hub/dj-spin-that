<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex"><title>Apple Music test · DJ Spin That</title>
<style>body{margin:0;background:#110a1d;color:#f4efff;font:16px/1.45 system-ui,-apple-system,sans-serif;padding:20px 16px 60px}
h1{font-size:22px;margin:0 0 6px}p{color:#b8a9d6;margin:0 0 14px}
.c{border:1px solid rgba(244,239,255,.16);border-radius:14px;padding:12px;margin:0 0 12px;display:grid;gap:6px}
.c b{font-size:18px}.s{font:13px ui-monospace,monospace;color:#b8a9d6;overflow-wrap:anywhere}
.ok{color:#5fe0a0}.bad{color:#ff7a8a}
a{display:inline-block;margin:4px 6px 0 0;padding:10px 14px;border-radius:999px;background:#c77dff;color:#1a0b2e;font-weight:700;text-decoration:none}
a.alt{background:transparent;color:#f4efff;border:1px solid #c77dff}</style></head><body>
<h1>Apple Music test</h1>
<p>Wait a few seconds, then screenshot this page and send it. Try the buttons too and tell me which ones open the song.</p>
<div id="out"></div>
<script>
const SONGS=["Crystal Snow","Dimple","Spring Day"];
const out=document.getElementById('out');
SONGS.forEach((t,i)=>{
  const id='c'+i,cb='__t'+i,q='BTS '+t;
  out.insertAdjacentHTML('beforeend',`<div class="c" id="${id}"><b>${t}</b><div class="s" id="${id}s">Asking Apple…</div><div id="${id}l"></div></div>`);
  const st=document.getElementById(id+'s'),ln=document.getElementById(id+'l');
  let done=false;
  window[cb]=j=>{done=true;const rs=(j&&j.results)||[];const bts=rs.filter(r=>/bts/i.test(r.artistName||''));
    const best=bts.find(r=>(r.trackName||'').toLowerCase()===t.toLowerCase())||bts[0];
    st.innerHTML=`<span class="ok">Apple answered.</span> ${rs.length} results, ${bts.length} by BTS.<br>Picked: ${best?best.trackName+' · '+best.collectionName:'nothing'}<br>Link: ${best?best.trackViewUrl:'—'}`;
    if(best){const u=best.trackViewUrl,tid=best.trackId,cid=best.collectionId;
      ln.innerHTML=`<a href="${u}">A · Song link</a><a class="alt" href="music://music.apple.com/us/album/${cid}?i=${tid}">B · Music app link</a><a class="alt" href="https://music.apple.com/us/song/${tid}">C · Song page</a>`}};
  const s=document.createElement('script');
  s.onerror=()=>{st.innerHTML='<span class="bad">Apple did not answer (blocked or offline).</span>'};
  s.src='https://itunes.apple.com/search?'+new URLSearchParams({term:q,entity:'song',limit:'15',country:'us',callback:cb});
  document.head.appendChild(s);
  setTimeout(()=>{if(!done&&st.textContent.startsWith('Asking'))st.innerHTML='<span class="bad">No answer after 8 seconds.</span>'},8000);
});
out.insertAdjacentHTML('beforeend',`<p>Your browser: ${navigator.userAgent}</p>`);
</script></body></html>
